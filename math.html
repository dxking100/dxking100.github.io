<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學計算！🧮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Comic Sans MS', 'YouYuan', cursive, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景裝飾 */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 183, 178, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 218, 185, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 224, 178, 0.3) 0%, transparent 50%);
            animation: floatBg 15s ease-in-out infinite;
        }

        @keyframes floatBg {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 漂浮星星 */
        .star {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 2s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .back-btn {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1em;
            font-family: inherit;
            font-weight: bold;
            color: #1e5631;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(168, 230, 207, 0.4);
            align-self: flex-start;
            margin-bottom: 15px;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(168, 230, 207, 0.6);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        /* 標題區域 */
        .header-title {
            text-align: center;
            font-size: 1.8em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 題目區域 */
        main {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .questions-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 題目卡片 */
        .question-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 4px solid #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .question-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .question-card.correct {
            border-color: #43e97b;
            background: linear-gradient(135deg, rgba(67, 233, 123, 0.2) 0%, rgba(56, 249, 215, 0.2) 100%);
        }

        .question-card.wrong {
            border-color: #f5576c;
            background: linear-gradient(135deg, rgba(245, 87, 108, 0.2) 0%, rgba(255, 147, 251, 0.2) 100%);
        }

        .question-number {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .question-text {
            flex: 1;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        .answer-input {
            width: 80px;
            height: 50px;
            border: 3px solid #a8e6cf;
            border-radius: 15px;
            font-size: 1.3em;
            text-align: center;
            font-family: inherit;
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }

        .answer-input:focus {
            border-color: #feca57;
            box-shadow: 0 0 15px rgba(254, 202, 87, 0.5);
        }

        .answer-input.correct {
            border-color: #43e97b;
            background: #e8f5e9;
        }

        .answer-input.wrong {
            border-color: #f5576c;
            background: #ffebee;
        }

        /* 底部按鈕區域 */
        footer {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(168, 230, 207, 0.4);
            border: 4px solid #fff;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        .action-btn {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border: 4px solid #ff9a9e;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 1.3em;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .action-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        .action-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .check-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            border-color: #38f9d7;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .score-display {
            text-align: center;
            font-size: 1.5em;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-top: 15px;
            display: none;
        }

        .score-display.show {
            display: block;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .questions-container {
                grid-template-columns: 1fr;
            }

            .question-card {
                padding: 15px;
            }

            .question-text {
                font-size: 1.3em;
            }

            .answer-input {
                width: 70px;
                height: 45px;
                font-size: 1.2em;
            }

            .action-btn {
                padding: 10px 20px;
                font-size: 1.1em;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }

            .header-title {
                font-size: 1.4em;
            }

            .question-text {
                font-size: 1.1em;
            }

            .answer-input {
                width: 60px;
                height: 40px;
                font-size: 1.1em;
            }

            .btn-row {
                flex-wrap: wrap;
                gap: 15px;
            }

            .action-btn {
                padding: 8px 15px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- 背景星星裝飾 -->
    <div class="star" style="top: 10%; left: 10%;">⭐</div>
    <div class="star" style="top: 20%; right: 15%; animation-delay: 0.5s;">🌟</div>
    <div class="star" style="top: 60%; left: 20%; animation-delay: 1s;">⭐</div>
    <div class="star" style="top: 80%; right: 10%; animation-delay: 1.5s;">🌟</div>

    <div class="container">
        <button id="back" class="back-btn">⬅️ 返回</button>
        
        <h1 class="header-title">🧮 數學計算練習 🧮</h1>

        <main>
            <div class="questions-container" id="questionsContainer">
                <!-- 題目將由 JavaScript 生成 -->
            </div>
        </main>

        <footer>
            <div class="btn-row">
                <button id="checkBtn" class="action-btn check-btn">✅ 檢查答案</button>
                <button id="refreshBtn" class="action-btn">🔄 重新生成</button>
            </div>
            <div class="score-display" id="scoreDisplay"></div>
        </footer>
    </div>

    <script>
        let questions = [];
        let answers = [];

        // 生成隨機數
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 生成 20 以內的數學題
        function generateQuestion() {
            const type = getRandomInt(1, 3); // 1: 加法，2: 減法，3: 連加
            let question, answer;

            if (type === 1) {
                // 加法 (結果不超過 20)
                const num1 = getRandomInt(1, 10);
                const num2 = getRandomInt(1, 20 - num1);
                question = `${num1} + ${num2} = ?`;
                answer = num1 + num2;
            } else if (type === 2) {
                // 減法 (被減數不超過 20，結果非負)
                const num1 = getRandomInt(5, 20);
                const num2 = getRandomInt(1, num1);
                question = `${num1} - ${num2} = ?`;
                answer = num1 - num2;
            } else {
                // 連加 (三個數相加，結果不超過 20)
                const num1 = getRandomInt(1, 6);
                const num2 = getRandomInt(1, 7);
                const num3 = getRandomInt(1, 20 - num1 - num2);
                question = `${num1} + ${num2} + ${num3} = ?`;
                answer = num1 + num2 + num3;
            }

            return { question, answer };
        }

        // 生成 20 條題目
        function generateQuestions() {
            questions = [];
            answers = [];
            for (let i = 0; i < 20; i++) {
                const q = generateQuestion();
                questions.push(q.question);
                answers.push(q.answer);
            }
        }

        // 渲染題目
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            for (let i = 0; i < questions.length; i++) {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="question-number">${i + 1}</div>
                    <div class="question-text">${questions[i]}</div>
                    <input type="number" class="answer-input" data-index="${i}" placeholder="?">
                `;
                container.appendChild(card);
            }
        }

        // 檢查答案
        function checkAnswers() {
            const inputs = document.querySelectorAll('.answer-input');
            let correctCount = 0;

            inputs.forEach((input, index) => {
                const userAnswer = parseInt(input.value);
                const card = input.closest('.question-card');

                // 移除之前的狀態
                card.classList.remove('correct', 'wrong');
                input.classList.remove('correct', 'wrong');

                if (userAnswer === answers[index]) {
                    card.classList.add('correct');
                    input.classList.add('correct');
                    correctCount++;
                } else {
                    card.classList.add('wrong');
                    input.classList.add('wrong');
                }
            });

            // 顯示分數
            const scoreDisplay = document.getElementById('scoreDisplay');
            scoreDisplay.textContent = `🎉 得分：${correctCount} / 20 🎉`;
            scoreDisplay.classList.add('show');

            // 播放音效
            if (correctCount === 20) {
                playSuccessSound();
            } else {
                playCheckSound();
            }
        }

        // 點擊音效
        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // 檢查音效
        function playCheckSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 600;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.2);
        }

        // 成功音效
        function playSuccessSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            [523, 659, 784, 1047].forEach((freq, i) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime + i * 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.1 + 0.3);
                
                oscillator.start(audioContext.currentTime + i * 0.1);
                oscillator.stop(audioContext.currentTime + i * 0.1 + 0.3);
            });
        }

        // 重新生成題目
        function refreshQuestions() {
            generateQuestions();
            renderQuestions();
            document.getElementById('scoreDisplay').classList.remove('show');
            playClickSound();
        }

        // 初始化
        generateQuestions();
        renderQuestions();

        // 事件監聽
        document.getElementById('back').addEventListener('click', function() {
            playClickSound();
            window.location.href = 'study.html';
        });

        document.getElementById('checkBtn').addEventListener('click', function() {
            playClickSound();
            checkAnswers();
        });

        document.getElementById('refreshBtn').addEventListener('click', function() {
            refreshQuestions();
        });

        // 禁用雙擊功能
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
            return false;
        });

        // 禁止多點觸屏
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
                event.stopPropagation();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        document.addEventListener('gesturechange', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        document.addEventListener('gestureend', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        // 禁止默認縮放手勢
        document.addEventListener('wheel', function(event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
