<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂學習！🎈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Comic Sans MS', 'YouYuan', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景裝飾 */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 183, 178, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 218, 185, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 224, 178, 0.3) 0%, transparent 50%);
            animation: floatBg 15s ease-in-out infinite;
        }

        @keyframes floatBg {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 漂浮星星 */
        .star {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 2s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 頭部區域 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(255, 154, 158, 0.4);
            border: 4px solid #fff;
        }

        .back-btn {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1em;
            font-family: inherit;
            font-weight: bold;
            color: #1e5631;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(168, 230, 207, 0.4);
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(168, 230, 207, 0.6);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .header-title {
            font-size: 1.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: bounce 2s ease-in-out infinite;
        }

        .hide-mode-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .hide-mode-label:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #hideMode {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #ff9a9e;
        }

        .hide-mode-text {
            font-size: 0.9em;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 中部內容區域 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            padding: 40px 60px;
            min-height: 300px;
            min-width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 6px dashed #ff9a9e;
            margin-bottom: 30px;
        }

        #content {
            font-size: 5em;
            font-weight: bold;
            text-align: center;
            animation: contentPop 0.5s ease;
        }

        @keyframes contentPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 底部按鈕區域 */
        footer {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(168, 230, 207, 0.4);
            border: 4px solid #fff;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        .control-btn {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border: 4px solid #ff9a9e;
            border-radius: 25px;
            padding: 15px 30px;
            font-size: 1.5em;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .control-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        .control-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        .play-btn {
            background: linear-gradient(135deg, #89c4f4 0%, #6bb3e0 100%);
            border-color: #5da3d8;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        /* 頁尾版權 */
        .copyright {
            text-align: center;
            padding: 15px;
            color: #fff;
            font-size: 0.9em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            margin-top: 15px;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .content-box {
                min-width: 90%;
                padding: 30px 40px;
                min-height: 250px;
            }
            #content {
                font-size: 3.5em;
            }
            .btn-row {
                flex-wrap: wrap;
                gap: 15px;
            }
            .control-btn {
                min-width: 100px;
                padding: 12px 20px;
                font-size: 1.2em;
            }
            .header-title {
                font-size: 1.2em;
            }
        }

        @media (max-width: 480px) {
            .content-box {
                padding: 25px 30px;
                min-height: 200px;
                border-radius: 30px;
                border-width: 4px;
            }
            #content {
                font-size: 2.5em;
            }
            .control-btn {
                min-width: 80px;
                padding: 10px 15px;
                font-size: 1em;
            }
            header {
                padding: 12px 15px;
            }
            .back-btn {
                padding: 8px 15px;
                font-size: 0.9em;
            }
            .header-title {
                font-size: 1em;
            }
            .hide-mode-label {
                padding: 6px 10px;
            }
            .hide-mode-text {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <!-- 背景星星裝飾 -->
    <div class="star" style="top: 10%; left: 10%;">⭐</div>
    <div class="star" style="top: 20%; right: 15%; animation-delay: 0.5s;">🌟</div>
    <div class="star" style="top: 60%; left: 20%; animation-delay: 1s;">⭐</div>
    <div class="star" style="top: 80%; right: 10%; animation-delay: 1.5s;">🌟</div>

    <div class="container">
        <!-- 頭部 -->
        <header>
            <button id="back" class="back-btn">
                ⬅️
            </button>
            <h1 class="header-title">🎈 快樂學習！ 🎈</h1>
            <label class="hide-mode-label">
                <input type="checkbox" id="hideMode">
                <span class="hide-mode-text">隱藏模式</span>
            </label>
        </header>

        <!-- 中部 -->
        <main>
            <div class="content-box">
                <div id="content"></div>
            </div>
        </main>

        <!-- 底部按鈕 -->
        <footer>
            <div class="btn-row">
                <button id="prev" class="control-btn">
                    ⏮️
                </button>
                <button id="showAnswer" class="control-btn play-btn">
                    👁️
                </button>
                <button id="playAudio" class="control-btn play-btn">
                    🔊
                </button>
                <button id="next" class="control-btn">
                    ⏭️
                </button>
            </div>
            <div class="copyright">
                © 2025 Duideduo. 版權所有。 ❤️
            </div>
        </footer>
    </div>

    <script>
        // 點擊音效
        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // 获取当前页面的 URL 參數
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const selectValue = urlParams.get('selectValue');
        const languageValue = urlParams.get('languageValue');

        let isChinese = false;

        // 單字庫
        let level1_eng = ["microwave", "oven", "cooker", "stove", "sink", 
                    "tap", "fridge", "cabinet", "blender", "dishwasher","coloured pencil","highlighter","paper clip","stapler","rubber","scissors","tape","glue stick"];
        
        let level2_eng = ["spring","summer","autumn","winter","rainy","sunny","windy","snowy","snow","snowball","snowman","hat","scarf","button","snowflake","icicle","sleigh","santa claus","reindeer","christmas tree","stocking","present","chimney","fireplace"];

        let k2_eng=["sex",
        "sun",
        "sad",
        "snake",
        "grass",
        "kiss",
        "bus",
        "book",
        "crayon",
        "pencil",
        "school bag",
        "tiger",
        "teacher",
        "toy",
        "goat",
        "cat",
        "fat",
        "ear",
        "eye",
        "mouth",
        "nose",
        "teeth",
        "ant",
        "apple",
        "rat",
        "bag",
        "hat",
        "grandfather",
        "grandmother",
        "sister",
        "brother",
        "daddy",
        "mummy",
        "pig",
        "panda",
        "pizza",
        "sheep",
        "map",
        "cup",
        "climb",
        "dance",
        "jump",
        "run",
        "walk",
        "nest",
        "nap",
        "nut",
        "hen",
        "bread",
        "butter",
        "cheese",
        "jam",
        "juice",
        "milk"];

        let k2_chg=["你好",
        "同學",
        "唱歌",
        "課室",
        "老師",
        "朋友",
        "對不起",
        "謝謝",
        "再見",
        "上",
        "中",
        "下",
        "爸爸",
        "媽媽",
        "家",
        "身體",
        "男孩子",
        "女孩子",
        "長",
        "短",
        "哥哥",
        "弟弟",
        "姐姐",
        "妹妹",
        "哭",
        "笑",
        "開心",
        "傷心",
        "生氣",
        "水果",
        "麵條",
        "牛奶",
        "農夫",
        "蔬菜",
        "青瓜",
        "米",
        "肉",
        "魚",
        "芝士",
        "雞蛋",
        "豆",
        "胡蘿蔔",
        "冬天",
        "火鍋",
        "做運動",
        "寒冷"];

        let k3_eng=[
                    "chick", "duck", "dress", "hair", "ear", "eye", "face", "tooth", "knife", "beer", "bicycle", "flower", "train", "eraser", "socks", "hand", "arm", "tooth","sofa", "banana", "lemon",
                    "school", "teacher", "ship", "bicycle", "clock", "ruler", "chair", "pizza", "dress",
                    "telephone"
                ];

        let k3_chg=[
        "蘋果", "足球", "汽車", "西瓜", "玩具", "眼睛", "太陽", "月亮", "水果", "女孩", "男孩", "風扇", "花朵", "蛋糕","蝴蝶", "书本", "耳", "鼻",
         "课室", "剪刀", "耳朵", "中国", "河马", "毛巾", "牙齿", "风扇",
        "衣物"];

        let items = [];
        if(selectValue ==='2' && languageValue==='英'){
            items = k2_eng;
            isChinese = false;
        }else  if(selectValue ==='2' && languageValue==='中'){
            items = k2_chg;
            isChinese = true;
        }else if(selectValue ==='3' && languageValue==='英'){
            items = k3_eng;
            isChinese = false;
        }else  if(selectValue ==='3' && languageValue==='中'){
            items = k3_chg;
            isChinese = true;
        }else if(selectValue ==='4' && languageValue==='英'){
            items = level1_eng;
            isChinese = false;
        }else  if(selectValue ==='5' && languageValue==='英'){
            items = level2_eng;
            isChinese = false;
        }

        let currentIndex = 0;
        let isHideMode = false;
        let isAnswerShown = false;

        updateContent();

        // 隱藏單字中的隨機位數
        function hideWord(word) {
            if (word.length <= 2) {
                return '_ '.repeat(word.length).trim();
            }
            // 隨機顯示 1-2 個字符
            const showCount = Math.min(Math.floor(Math.random() * 2) + 1, word.length);
            const indices = new Set();
            while (indices.size < showCount) {
                indices.add(Math.floor(Math.random() * word.length));
            }
            let result = '';
            for (let i = 0; i < word.length; i++) {
                if (indices.has(i)) {
                    result += word[i] + ' ';
                } else {
                    result += '_ ';
                }
            }
            return result.trim();
        }

        function updateContent() {
            const currentItem = items[currentIndex];
            const contentDiv = document.getElementById('content');
            
            // 觸發重新渲染動畫
            contentDiv.style.animation = 'none';
            contentDiv.offsetHeight; // 觸發重繪
            contentDiv.style.animation = 'contentPop 0.5s ease';
            
            // 根據隱藏模式和答案顯示狀態來顯示內容
            if (isHideMode && !isAnswerShown) {
                contentDiv.textContent = hideWord(currentItem);
            } else {
                contentDiv.textContent = currentItem;
            }
        }

        // 隱藏模式切換
        document.getElementById('hideMode').addEventListener('change', function() {
            isHideMode = this.checked;
            isAnswerShown = false;
            updateContent();
        });

        // 顯示答案按鈕
        document.getElementById('showAnswer').addEventListener('click', function() {
            if (isHideMode) {
                isAnswerShown = !isAnswerShown;
                updateContent();
            }
            playClickSound();
        });

        // 返回按鈕
        document.getElementById('back').addEventListener('click', function() {
            playClickSound();
            window.history.back();
        });

        document.getElementById('prev').addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
                isAnswerShown = false;
                updateContent();
            }
            playClickSound();
        });

        document.getElementById('next').addEventListener('click', function() {
            if (currentIndex < items.length - 1) {
                currentIndex++;
                isAnswerShown = false;
                updateContent();
            }
            playClickSound();
        });

        document.getElementById('back').addEventListener('click', function() {
            window.history.back();
        });

        document.getElementById('playAudio').addEventListener('click', function() {
            const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
            utterance.lang = isChinese ? 'zh-HK' : 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
        });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (e.code === 'ArrowLeft') {
                if (currentIndex > 0) {
                    currentIndex--;
                    isAnswerShown = false;
                    updateContent();
                }
            } else if (e.code === 'ArrowRight') {
                if (currentIndex < items.length - 1) {
                    currentIndex++;
                    isAnswerShown = false;
                    updateContent();
                }
            } else if (e.code === 'Space') {
                e.preventDefault();
                if (isHideMode) {
                    isAnswerShown = !isAnswerShown;
                    updateContent();
                } else {
                    const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
                    utterance.lang = isChinese ? 'zh-HK' : 'en-US';
                    utterance.rate = 0.9;
                    utterance.pitch = 1.1;
                    speechSynthesis.speak(utterance);
                }
            } else if (e.code === 'KeyP') {
                const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
                utterance.lang = isChinese ? 'zh-HK' : 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                speechSynthesis.speak(utterance);
            }
        });
    </script>
</body>
</html>
