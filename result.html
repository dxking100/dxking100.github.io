<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂學習！🎈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Comic Sans MS', 'YouYuan', cursive, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景裝飾 */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 183, 178, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 218, 185, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 224, 178, 0.3) 0%, transparent 50%);
            animation: floatBg 15s ease-in-out infinite;
        }

        @keyframes floatBg {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 漂浮星星 */
        .star {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 2s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 頭部區域 */
        header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(255, 154, 158, 0.4);
            border: 4px solid #fff;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1em;
            font-family: inherit;
            font-weight: bold;
            color: #1e5631;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(168, 230, 207, 0.4);
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(168, 230, 207, 0.6);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .header-title {
            font-size: 1.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: bounce 2s ease-in-out infinite;
        }

        .hide-mode-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .hide-mode-label:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #hideMode {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #ff9a9e;
        }

        .hide-mode-text {
            font-size: 0.9em;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 中部內容區域 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 20px;
        }

        /* 內容和圖片容器 */
        .content-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .content-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            padding: 60px 40px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 6px dashed #ff9a9e;
        }

        /* 圖片搜索 iframe */
        .image-search-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border: 4px solid #a8e6cf;
            min-height: 400px;
            overflow: hidden;
        }

        #imageFrame {
            width: 100%;
            height: calc(100% + 170px);
            border: none;
            border-radius: 20px;
            transform: translateY(-170px);
            pointer-events: none;
        }

        #content {
            font-size: 7em;
            font-weight: bold;
            text-align: center;
            animation: contentPop 0.5s ease;
        }

        @keyframes contentPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .control-btn {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border: 4px solid #ff9a9e;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1.3em;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 60px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .control-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        .control-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .play-btn {
            background: linear-gradient(135deg, #89c4f4 0%, #6bb3e0 100%);
            border-color: #5da3d8;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .header-row {
                justify-content: center;
            }
            .content-wrapper {
                flex-direction: column;
            }
            .content-box {
                min-width: 100%;
                padding: 40px 50px;
                min-height: 300px;
            }
            .image-search-container {
                min-width: 100%;
                min-height: 300px;
            }
            #content {
                font-size: 5em;
            }
            .control-btn {
                min-width: 80px;
                padding: 10px 15px;
                font-size: 1.1em;
            }
        }

        @media (max-width: 480px) {
            .header-row {
                justify-content: center;
            }
            .content-wrapper {
                flex-direction: column;
            }
            .content-box {
                padding: 35px 40px;
                min-height: 250px;
                border-radius: 30px;
                border-width: 4px;
            }
            .image-search-container {
                min-height: 250px;
            }
            #content {
                font-size: 3.5em;
            }
            .control-btn {
                min-width: 60px;
                padding: 8px 12px;
                font-size: 1em;
            }
            header {
                padding: 12px 15px;
            }
            .back-btn {
                padding: 8px 15px;
                font-size: 0.9em;
            }
            .hide-mode-label {
                padding: 6px 10px;
            }
            .hide-mode-text {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <!-- 背景星星裝飾 -->
    <div class="star" style="top: 10%; left: 10%;">⭐</div>
    <div class="star" style="top: 20%; right: 15%; animation-delay: 0.5s;">🌟</div>
    <div class="star" style="top: 60%; left: 20%; animation-delay: 1s;">⭐</div>
    <div class="star" style="top: 80%; right: 10%; animation-delay: 1.5s;">🌟</div>

    <div class="container">
        <!-- 頭部 -->
        <header>
            <div class="header-row">
                <div class="header-left">
                    <button id="back" class="back-btn">
                        ⬅️
                    </button>
                </div>
                <div class="header-right">
                    <label class="hide-mode-label">
                        <input type="checkbox" id="hideMode">
                        <span class="hide-mode-text">隱藏模式</span>
                    </label>
                </div>
            </div>
            <div class="header-row">
                <div class="header-controls">
                    <button id="prev" class="control-btn">
                        ⏮️
                    </button>
                    <button id="showAnswer" class="control-btn play-btn">
                        👁️
                    </button>
                    <button id="playAudio" class="control-btn play-btn">
                        🔊
                    </button>
                    <button id="next" class="control-btn">
                        ⏭️
                    </button>
                </div>
            </div>
        </header>

        <!-- 中部 -->
        <main>
            <div class="content-wrapper">
                <div class="content-box">
                    <div id="content"></div>
                </div>
                <!-- 圖片搜索 iframe -->
                <div class="image-search-container">
                    <iframe id="imageFrame" src="" title="圖片搜索"></iframe>
                </div>
            </div>
        </main>

    </div>

    <script>
        // 點擊音效
        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // 获取当前页面的 URL 參數
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const selectValue = urlParams.get('selectValue');
        const languageValue = urlParams.get('languageValue');

        let isChinese = false;

        // 單字庫
        let level1_eng = ["microwave", "oven", "cooker", "stove", "sink", 
                    "tap", "fridge", "cabinet", "blender", "dishwasher","coloured pencil","highlighter","paper clip","stapler","rubber","scissors","tape","glue stick"];
        
        let level2_eng = ["spring","summer","autumn","winter","rainy","sunny","windy","snowy","snow","snowball","snowman","hat","scarf","button","snowflake","icicle","sleigh","santa claus","reindeer","christmas tree","stocking","present","chimney","fireplace"];

        let k2_eng=["sex",
        "sun",
        "sad",
        "snake",
        "grass",
        "kiss",
        "bus",
        "book",
        "crayon",
        "pencil",
        "school bag",
        "tiger",
        "teacher",
        "toy",
        "goat",
        "cat",
        "fat",
        "ear",
        "eye",
        "mouth",
        "nose",
        "teeth",
        "ant",
        "apple",
        "rat",
        "bag",
        "hat",
        "grandfather",
        "grandmother",
        "sister",
        "brother",
        "daddy",
        "mummy",
        "pig",
        "panda",
        "pizza",
        "sheep",
        "map",
        "cup",
        "climb",
        "dance",
        "jump",
        "run",
        "walk",
        "nest",
        "nap",
        "nut",
        "hen",
        "bread",
        "butter",
        "cheese",
        "jam",
        "juice",
        "milk"];

        let k2_chg=["你好",
        "同學",
        "唱歌",
        "課室",
        "老師",
        "朋友",
        "對不起",
        "謝謝",
        "再見",
        "上",
        "中",
        "下",
        "爸爸",
        "媽媽",
        "家",
        "身體",
        "男孩子",
        "女孩子",
        "長",
        "短",
        "哥哥",
        "弟弟",
        "姐姐",
        "妹妹",
        "哭",
        "笑",
        "開心",
        "傷心",
        "生氣",
        "水果",
        "麵條",
        "牛奶",
        "農夫",
        "蔬菜",
        "青瓜",
        "米",
        "肉",
        "魚",
        "芝士",
        "雞蛋",
        "豆",
        "胡蘿蔔",
        "冬天",
        "火鍋",
        "做運動",
        "寒冷"];

        let k3_eng=[
                    "chick", "duck", "dress", "hair", "ear", "eye", "face", "tooth", "knife", "bear", "bicycle", "flower", "train", "eraser", "socks", "hand", "arm", "sofa", "banana", "lemon",
                    "school", "teacher", "ship", "clock", "ruler", "chair", "pizza",
                    "telephone"
                ];

        let k3_chg=[
        "蘋果", "足球", "汽車", "西瓜", "玩具", "眼睛", "太陽", "月亮", "水果", "女孩", "男孩", "風扇", "花朵", "蛋糕","蝴蝶", "书本", "耳", "鼻",
         "课室", "剪刀", "耳朵", "中国", "河马", "毛巾", "牙齿", "风扇",
        "衣物"];

        let items = [];
        if(selectValue ==='2' && languageValue==='英'){
            items = k2_eng;
            isChinese = false;
        }else  if(selectValue ==='2' && languageValue==='中'){
            items = k2_chg;
            isChinese = true;
        }else if(selectValue ==='3' && languageValue==='英'){
            items = k3_eng;
            isChinese = false;
        }else  if(selectValue ==='3' && languageValue==='中'){
            items = k3_chg;
            isChinese = true;
        }else if(selectValue ==='4' && languageValue==='英'){
            items = level1_eng;
            isChinese = false;
        }else  if(selectValue ==='5' && languageValue==='英'){
            items = level2_eng;
            isChinese = false;
        }

        let currentIndex = 0;
        let isHideMode = false;
        let isAnswerShown = false;
        let pronouncedWords = []; // 記錄已發音的單詞索引
        let randomReviewChance = 0.4; // 40% 機率隨機複習已發音的單詞

        updateContent();

        // 隱藏單字中的隨機位數
        function hideWord(word) {
            if (word.length <= 2) {
                return '_ '.repeat(word.length).trim();
            }
            // 隨機顯示 1-2 個字符
            const showCount = Math.min(Math.floor(Math.random() * 2) + 1, word.length);
            const indices = new Set();
            while (indices.size < showCount) {
                indices.add(Math.floor(Math.random() * word.length));
            }
            let result = '';
            for (let i = 0; i < word.length; i++) {
                if (indices.has(i)) {
                    result += word[i] + ' ';
                } else {
                    result += '_ ';
                }
            }
            return result.trim();
        }

        function updateContent() {
            const currentItem = items[currentIndex];
            const contentDiv = document.getElementById('content');
            
            // 觸發重新渲染動畫
            contentDiv.style.animation = 'none';
            contentDiv.offsetHeight; // 觸發重繪
            contentDiv.style.animation = 'contentPop 0.5s ease';
            
            // 根據隱藏模式和答案顯示狀態來顯示內容
            if (isHideMode && !isAnswerShown) {
                contentDiv.textContent = hideWord(currentItem);
            } else {
                contentDiv.textContent = currentItem;
            }
            
            // 更新 iframe 圖片搜索 URL
            updateImageSearch(currentItem);
        }

        // 更新圖片搜索 iframe
        function updateImageSearch(word) {
            const imageFrame = document.getElementById('imageFrame');
            const searchUrl = `https://www.bing.com/images/search?q=${encodeURIComponent(word)}+Cartoon+Png&form=IRTRRL&first=1`;
            imageFrame.src = searchUrl;
            
            // iframe 加載後自動向下滾動 170px（延遲執行）
            setTimeout(function() {
                try {
                    const iframeDoc = imageFrame.contentDocument || imageFrame.contentWindow.document;
                    iframeDoc.documentElement.scrollTop = 170;
                    iframeDoc.body.scrollTop = 170;
                    iframeDoc.body.scrollBy(0, 170);
                } catch(e) {
                    // 跨域限制，嘗試使用 postMessage
                    console.log('跨域限制，嘗試其他方法');
                }
            }, 1500);
        }

        // 隱藏模式切換
        document.getElementById('hideMode').addEventListener('change', function() {
            isHideMode = this.checked;
            isAnswerShown = false;
            updateContent();
        });

        // 顯示答案按鈕
        document.getElementById('showAnswer').addEventListener('click', function() {
            if (isHideMode) {
                isAnswerShown = !isAnswerShown;
                updateContent();
            }
            playClickSound();
        });

        // 返回按鈕
        document.getElementById('back').addEventListener('click', function() {
            playClickSound();
            window.history.back();
        });

        document.getElementById('prev').addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
                isAnswerShown = false;
                updateContent();
            }
            playClickSound();
        });

        document.getElementById('next').addEventListener('click', function() {
            isAnswerShown = false;
            
            // 如果有已發音的單詞，且隨機數小於複習機率，則隨機選擇一個已發音的單詞
            if (pronouncedWords.length > 0 && Math.random() < randomReviewChance) {
                const randomIndex = Math.floor(Math.random() * pronouncedWords.length);
                currentIndex = pronouncedWords[randomIndex];
            } else {
                // 否則正常進入下一個
                if (currentIndex < items.length - 1) {
                    currentIndex++;
                }
            }
            
            updateContent();
            playClickSound();
        });

        document.getElementById('back').addEventListener('click', function() {
            window.history.back();
        });

        document.getElementById('playAudio').addEventListener('click', function() {
            const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
            utterance.lang = isChinese ? 'zh-HK' : 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
            
            // 將當前單詞加入已發音列表（如果還不在列表中）
            if (!pronouncedWords.includes(currentIndex)) {
                pronouncedWords.push(currentIndex);
            }
        });

        // 禁用雙擊功能
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
            return false;
        });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (e.code === 'ArrowLeft') {
                if (currentIndex > 0) {
                    currentIndex--;
                    isAnswerShown = false;
                    updateContent();
                }
            } else if (e.code === 'ArrowRight') {
                if (currentIndex < items.length - 1) {
                    currentIndex++;
                    isAnswerShown = false;
                    updateContent();
                }
            } else if (e.code === 'Space') {
                e.preventDefault();
                if (isHideMode) {
                    isAnswerShown = !isAnswerShown;
                    updateContent();
                } else {
                    const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
                    utterance.lang = isChinese ? 'zh-HK' : 'en-US';
                    utterance.rate = 0.9;
                    utterance.pitch = 1.1;
                    speechSynthesis.speak(utterance);
                    // 將當前單詞加入已發音列表
                    if (!pronouncedWords.includes(currentIndex)) {
                        pronouncedWords.push(currentIndex);
                    }
                }
            } else if (e.code === 'KeyP') {
                const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
                utterance.lang = isChinese ? 'zh-HK' : 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                speechSynthesis.speak(utterance);
                // 將當前單詞加入已發音列表
                if (!pronouncedWords.includes(currentIndex)) {
                    pronouncedWords.push(currentIndex);
                }
            }
        });
    </script>
</body>
