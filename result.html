    <title>快樂學習！🎈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Comic Sans MS', 'YouYuan', cursive, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景裝飾 */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 183, 178, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 218, 185, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 224, 178, 0.3) 0%, transparent 50%);
            animation: floatBg 15s ease-in-out infinite;
        }

        @keyframes floatBg {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 漂浮星星 */
        .star {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 2s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .back-btn {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1em;
            font-family: inherit;
            font-weight: bold;
            color: #1e5631;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(168, 230, 207, 0.4);
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(168, 230, 207, 0.6);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .header-title {
            font-size: 1.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: bounce 2s ease-in-out infinite;
        }

        .hide-mode-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .hide-mode-label:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #hideMode {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #ff9a9e;
        }

        .hide-mode-text {
            font-size: 0.9em;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 中部內容區域 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 20px;
        }

        /* 卡片容器 - 改為 Grid 佈局 */
        .cards-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            height: 100%;
        }

        /* 卡片樣式 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.12);
            border: 5px dashed #ff9a9e;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
        }

        /* 文字卡片 */
        .text-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 240, 245, 0.95) 100%);
            border-color: #ff9a9e;
        }

        /* iframe 卡片 */
        .iframe-card {
            background: linear-gradient(135deg, rgba(240, 255, 250, 0.95) 0%, rgba(230, 255, 255, 0.9) 100%);
            border: 5px solid #a8e6cf;
            padding: 15px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* iframe 隱藏狀態 */
        .iframe-card.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* iframe 顯示狀態 */
        .iframe-card.visible {
            opacity: 1;
            visibility: visible;
        }

        #content {
            font-size: 6em;
            font-weight: bold;
            text-align: center;
            animation: contentPop 0.5s ease;
            word-break: break-word;
            line-height: 1.3;
        }

        @keyframes contentPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* iframe 容器 */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        #imageFrame {
            width: 100%;
            height: calc(100% + 150px);
            border: none;
            border-radius: 20px;
            transform: translateY(-150px);
            pointer-events: none;
        }

        .control-btn {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border: 4px solid #ff9a9e;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1.3em;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 60px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .control-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        .control-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .play-btn {
            background: linear-gradient(135deg, #89c4f4 0%, #6bb3e0 100%);
            border-color: #5da3d8;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        /* 底部按鈕區域 */
        footer {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(168, 230, 207, 0.4);
            border: 4px solid #fff;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        /* ========== iPad 橫屏優化 ========== */
        @media (min-width: 1024px) and (orientation: landscape) {
            .container {
                padding: 25px;
            }

            .cards-container {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: minmax(400px, 1fr);
                gap: 25px;
                max-width: 1100px;
            }

            .card {
                border-radius: 35px;
                padding: 35px;
            }

            #content {
                font-size: 5.4em;
            }

            .footer-top {
                flex-direction: row;
            }
        }

        /* ========== iPad 豎屏優化 ========== */
        @media (max-width: 1024px) and (orientation: portrait) {
            .container {
                padding: 15px;
            }

            .cards-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
                gap: 15px;
                max-width: 100%;
            }

            .card {
                min-height: 280px;
                border-radius: 25px;
                padding: 25px;
            }

            .text-card {
                order: 1;
            }

            .iframe-card {
                order: 2;
                min-height: 350px;
            }

            #content {
                font-size: 4.8em;
            }

            footer {
                margin-top: 15px;
            }

            .footer-top {
                flex-direction: row;
            }
        }

        /* ========== 手機優化 ========== */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .cards-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .card {
                min-height: 220px;
                border-radius: 20px;
                padding: 20px;
            }

            .text-card {
                order: 1;
            }

            .iframe-card {
                order: 2;
                min-height: 280px;
            }

            #content {
                font-size: 3.6em;
            }

            .control-btn {
                min-width: 50px;
                padding: 8px 15px;
                font-size: 1.1em;
            }

            .footer-top {
                flex-direction: column;
                gap: 10px;
            }

            .btn-row {
                flex-wrap: wrap;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .card {
                min-height: 180px;
                border-radius: 18px;
                padding: 15px;
            }

            #content {
                font-size: 2.64em;
            }

            .control-btn {
                min-width: 45px;
                padding: 6px 12px;
                font-size: 1em;
            }

            .back-btn {
                padding: 8px 15px;
                font-size: 0.9em;
            }

            .hide-mode-label {
                padding: 6px 10px;
            }

            .hide-mode-text {
                font-size: 0.8em;
            }

            .footer-top {
                flex-direction: column;
                gap: 10px;
            }

            .btn-row {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);

        // 隱藏單字中的隨機位數
        function hideWord(word) {
            if (word.length <= 2) {
                return '_ '.repeat(word.length).trim();
            }
            // 隨機顯示 1-2 個字符
            const showCount = Math.min(Math.floor(Math.random() * 2) + 1, word.length);
            const indices = new Set();
            while (indices.size < showCount) {
                indices.add(Math.floor(Math.random() * word.length));
            }
            let result = '';
            for (let i = 0; i < word.length; i++) {
                if (indices.has(i)) {
                    result += word[i] + ' ';
                } else {
                    result += '_ ';
                }
            }
            return result.trim();
        }

        function updateContent() {
            const currentItem = items[currentIndex];
            const contentDiv = document.getElementById('content');
            const iframeCard = document.querySelector('.iframe-card');
            
            // 觸發重新渲染動畫
            contentDiv.style.animation = 'none';
            contentDiv.offsetHeight; // 觸發重繪
            contentDiv.style.animation = 'contentPop 0.5s ease';
            
            // 根據隱藏模式和答案顯示狀態來顯示內容
            if (isHideMode && !isAnswerShown) {
                contentDiv.textContent = hideWord(currentItem);
            } else {
                contentDiv.textContent = currentItem;
            }
            
            // 切換單詞時隱藏 iframe
            isIframeVisible = false;
            iframeCard.classList.remove('visible');
            iframeCard.classList.add('hidden');
            
            // 更新 iframe 圖片搜索 URL（在隱藏狀態下加載）
            updateImageSearch(currentItem);
        }

        // 更新圖片搜索 iframe
        function updateImageSearch(word) {
            const imageFrame = document.getElementById('imageFrame');
            const searchUrl = `https://www.bing.com/images/search?q=${encodeURIComponent(word)}+Cartoon+Png&form=IRTRRL&first=1`;
            imageFrame.src = searchUrl;
            // iframe 已通過 CSS transform: translateY(-150px) 實現向下偏移 150px
        }

        // 隱藏模式切換
        document.getElementById('hideMode').addEventListener('change', function() {
            isHideMode = this.checked;
            isAnswerShown = false;
            updateContent();
        });

        // 顯示答案按鈕
        document.getElementById('showAnswer').addEventListener('click', function() {
            const iframeCard = document.querySelector('.iframe-card');
            
            if (isHideMode) {
                isAnswerShown = !isAnswerShown;
                updateContent();
            }
            
            // 切換 iframe 顯示狀態
            isIframeVisible = !isIframeVisible;
            if (isIframeVisible) {
                iframeCard.classList.remove('hidden');
                iframeCard.classList.add('visible');
            } else {
                iframeCard.classList.remove('visible');
                iframeCard.classList.add('hidden');
            }
            
            playClickSound();
        });

        // 返回按鈕
        document.getElementById('back').addEventListener('click', function() {
            playClickSound();
            window.location.href = 'study.html';
        });

        document.getElementById('prev').addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
                isAnswerShown = false;
                updateContent();
            }
            playClickSound();
        });

        document.getElementById('next').addEventListener('click', function() {
            isAnswerShown = false;
            
            // 如果有已發音的單詞，且隨機數小於複習機率，則隨機選擇一個已發音的單詞
            if (pronouncedWords.length > 0 && Math.random() < randomReviewChance) {
                const randomIndex = Math.floor(Math.random() * pronouncedWords.length);
                currentIndex = pronouncedWords[randomIndex];
            } else {
                // 否則正常進入下一個
                if (currentIndex < items.length - 1) {
                    currentIndex++;
                }
            }
            
            updateContent();
            playClickSound();
        });

        // 返回按鈕已在上定義，此處移除重複監聽器

        document.getElementById('playAudio').addEventListener('click', function() {
            const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
            utterance.lang = isChinese ? 'zh-HK' : 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
            
            // 將當前單詞加入已發音列表（如果還不在列表中）
            if (!pronouncedWords.includes(currentIndex)) {
                pronouncedWords.push(currentIndex);
            }
        });

        // 禁用雙擊功能
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
            return false;
        });

        // 禁止多點觸屏
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
                event.stopPropagation();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        document.addEventListener('gesturechange', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        document.addEventListener('gestureend', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        // 禁止默認縮放手勢
        document.addEventListener('wheel', function(event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        }, { passive: false });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (e.code === 'ArrowLeft') {
                if (currentIndex > 0) {
                    currentIndex--;
                    isAnswerShown = false;
                    updateContent();
                }
            } else if (e.code === 'ArrowRight') {
                if (currentIndex < items.length - 1) {
                    currentIndex++;
                    isAnswerShown = false;
                    updateContent();
                }
            } else if (e.code === 'Space') {
                e.preventDefault();
                if (isHideMode) {
                    isAnswerShown = !isAnswerShown;
                    updateContent();
                } else {
                    const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
                    utterance.lang = isChinese ? 'zh-HK' : 'en-US';
                    utterance.rate = 0.9;
                    utterance.pitch = 1.1;
                    speechSynthesis.speak(utterance);
                    // 將當前單詞加入已發音列表
                    if (!pronouncedWords.includes(currentIndex)) {
                        pronouncedWords.push(currentIndex);
                    }
                }
            } else if (e.code === 'KeyP') {
                const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
                utterance.lang = isChinese ? 'zh-HK' : 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                speechSynthesis.speak(utterance);
                // 將當前單詞加入已發音列表
                if (!pronouncedWords.includes(currentIndex)) {
                    pronouncedWords.push(currentIndex);
                }
            }
        });
    </script>
</body>
</html>
