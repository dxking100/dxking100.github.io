<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快樂學習！🎈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Comic Sans MS', 'YouYuan', cursive, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            position: relative;
            overflow: hidden;
        }

        /* 背景裝飾 */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 183, 178, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 218, 185, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 224, 178, 0.3) 0%, transparent 50%);
            animation: floatBg 15s ease-in-out infinite;
        }

        @keyframes floatBg {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 漂浮星星 */
        .star {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 2s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .back-btn {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border: 4px solid #fff;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1.3em;
            font-family: inherit;
            font-weight: bold;
            color: #1e5631;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 60px;
            box-shadow: 0 5px 15px rgba(168, 230, 207, 0.4);
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 50;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(168, 230, 207, 0.6);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .header-title {
            font-size: 1.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 中部內容區域 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 20px;
        }

        /* 卡片容器 - 上圖下字，比例 3:7 */
        .cards-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 3fr 7fr;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            height: 100%;
        }

        /* 卡片樣式 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.12);
            border: 5px dashed #ff9a9e;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
        }

        /* 文字卡片 */
        .text-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 240, 245, 0.95) 100%);
            border-color: #ff9a9e;
        }

        /* iframe 卡片 */
        .iframe-card {
            background: linear-gradient(135deg, rgba(240, 255, 250, 0.95) 0%, rgba(230, 255, 255, 0.9) 100%);
            border: 5px solid #a8e6cf;
            padding: 15px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        /* iframe 隱藏狀態 */
        .iframe-card.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* iframe 顯示狀態 */
        .iframe-card.visible {
            opacity: 1;
            visibility: visible;
        }

        #content {
            font-size: 10em;
            font-weight: bold;
            text-align: center;
            animation: contentPop 0.5s ease;
            word-break: break-word;
            line-height: 1.3;
        }

        /* 可點擊字母：一開始虛線框＋白底，點擊後填色 */
        .letter-span {
            cursor: pointer;
            display: inline-block;
            background: #fff;
            border: 0.04em dashed #999;
            border-radius: 0.15em;
            padding: 0 0.06em;
            margin: 0 0.03em;
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        .letter-span:active {
            transform: scale(0.94);
        }

        /* 點擊後：白底 → 英文藍底 */
        .letter-span.lit {
            background: linear-gradient(135deg, #89c4f4 0%, #6bb3e0 100%);
            border-color: #5da3d8;
            border-style: solid;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.25);
            animation: letterPop 0.3s ease;
        }

        @keyframes letterPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* 未全亮就按「下一個」時的搖晃提示 */
        @keyframes denyShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .deny-shake {
            animation: denyShake 0.4s ease;
        }

        .word-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        @keyframes contentPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* iframe 容器 */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            position: relative;
        }

        #imageFrame {
            width: 100%;
            height: calc(100% + 150px);
            border: none;
            border-radius: 20px;
            transform: translateY(-150px);
            pointer-events: none;
        }

        .control-btn {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border: 4px solid #ff9a9e;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1.3em;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 60px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .control-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        .control-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .play-btn {
            background: linear-gradient(135deg, #89c4f4 0%, #6bb3e0 100%);
            border-color: #5da3d8;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border-color: #feca57;
        }

        /* 底部按鈕區域 */
        footer {
            background: linear-gradient(135deg, #a8e6cf 0%, #88d8b0 100%);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(168, 230, 207, 0.4);
            border: 4px solid #fff;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        /* ===== 單字進度條 ===== */
        .progress-area {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .progress-track {
            flex: 1;
            height: 26px;
            background: rgba(255, 255, 255, 0.65);
            border: 3px solid #fff;
            border-radius: 999px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #ffd700 0%, #ff9a9e 100%);
            border-radius: 999px;
            transition: width 0.4s ease;
            position: relative;
        }

        /* 跟隨進度條尾端的星星 */
        .progress-fill::after {
            content: '⭐';
            position: absolute;
            top: 50%;
            right: 0;
            transform: translate(50%, -50%);
            font-size: 1.5em;
            line-height: 1;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.9));
            animation: starFollow 1.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes starFollow {
            0%, 100% { transform: translate(50%, -50%) scale(1) rotate(-8deg); }
            50% { transform: translate(50%, -50%) scale(1.25) rotate(8deg); }
        }

        .progress-text {
            font-size: 1.2em;
            font-weight: bold;
            color: #1e5631;
            min-width: 110px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.7);
            white-space: nowrap;
        }

        /* ========== iPad 橫屏優化 ========== */
        @media (min-width: 1024px) and (orientation: landscape) {
            .container {
                padding: 25px;
            }

            .cards-container {
                grid-template-columns: 1fr;
                grid-template-rows: 3fr 7fr;
                gap: 18px;
                max-width: 1100px;
            }

            .card {
                border-radius: 35px;
                padding: 20px;
            }

            .iframe-card {
                padding: 12px;
            }

            #content {
                font-size: 9.2em;
            }
        }

        /* ========== iPad 豎屏優化 ========== */
        @media (max-width: 1024px) and (orientation: portrait) {
            .container {
                padding: 15px;
            }

            .cards-container {
                grid-template-columns: 1fr;
                grid-template-rows: 3fr 7fr;
                gap: 15px;
                max-width: 100%;
            }

            .card {
                border-radius: 25px;
                padding: 18px;
            }

            .iframe-card {
                padding: 12px;
            }

            #content {
                font-size: 8em;
            }

            footer {
                margin-top: 15px;
            }
        }

        /* ========== 手機優化 ========== */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .cards-container {
                grid-template-columns: 1fr;
                grid-template-rows: 3fr 7fr;
                gap: 12px;
            }

            .card {
                border-radius: 20px;
                padding: 14px;
            }

            .iframe-card {
                padding: 10px;
            }

            #content {
                font-size: 6em;
            }

            .control-btn {
                min-width: 50px;
                padding: 8px 15px;
                font-size: 1.1em;
            }

            .progress-area {
                gap: 10px;
                margin-bottom: 12px;
            }

            .progress-track {
                height: 20px;
            }

            .progress-fill::after {
                font-size: 1.25em;
            }

            .progress-text {
                font-size: 1em;
                min-width: 86px;
            }

            .btn-row {
                flex-wrap: wrap;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .card {
                border-radius: 18px;
                padding: 12px;
            }

            #content {
                font-size: 4.5em;
            }

            .control-btn {
                min-width: 45px;
                padding: 6px 12px;
                font-size: 1em;
            }

            .back-btn {
                padding: 8px 15px;
                font-size: 1em;
                top: 10px;
                left: 10px;
            }

            .progress-text {
                font-size: 0.9em;
                min-width: 74px;
            }

            .btn-row {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>

        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        let items = [];
        if (categoryValue !== 'all' && categoryWords[categoryValue]) {
            items = categoryWords[categoryValue];
            isChinese = false;
        } else if(selectValue ==='2' && languageValue==='英'){
            items = k2_eng;
            isChinese = false;
        }else  if(selectValue ==='2' && languageValue==='中'){
            items = k2_chg;
            isChinese = true;
        }else if(selectValue ==='3' && languageValue==='英'){
            items = k3_eng;
            isChinese = false;
        }else  if(selectValue ==='3' && languageValue==='中'){
            items = k3_chg;
            isChinese = true;
        }else if(selectValue ==='4' && languageValue==='英'){
            items = level1_eng;
            isChinese = false;
        }else  if(selectValue ==='5' && languageValue==='英'){
            items = level2_eng;
            isChinese = false;
        }

        let currentIndex = 0;
        let isIframeVisible = true; // iframe 顯示狀態 - 默認自動打開
        let pronouncedWords = []; // 記錄已發音的單詞索引

        // 初始化 iframe 為可見狀態（自動打開）
        document.querySelector('.iframe-card').classList.remove('hidden');
        document.querySelector('.iframe-card').classList.add('visible');

        // 單詞按順序顯示，從第一個開始
        updateContent();

        function updateContent() {
            const currentItem = items[currentIndex];
            const contentDiv = document.getElementById('content');
            const iframeCard = document.querySelector('.iframe-card');
            
            // 觸發重新渲染動畫
            contentDiv.style.animation = 'none';
            contentDiv.offsetHeight; // 觸發重繪
            contentDiv.style.animation = 'contentPop 0.5s ease';
            
            // 建立可點擊字母（逐字高亮）
            buildLetters(contentDiv, currentItem);

            // 更新單字進度條
            updateProgress();
            
            // 切換單詞時保持 iframe 可見（自動打開模式）
            if (isIframeVisible) {
                iframeCard.classList.remove('hidden');
                iframeCard.classList.add('visible');
            }
            
            // 更新 iframe 圖片搜索 URL
            updateImageSearch(currentItem);
        }

        // 更新單字進度條（第幾個 / 共幾個）
        function updateProgress() {
            const total = items.length;
            const position = total > 0 ? currentIndex + 1 : 0;
            const percent = total > 0 ? (position / total) * 100 : 0;

            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = position + ' / ' + total;
        }

        // 把單詞拆成可點擊的字母 span（空格保留為一般文字，維持換行）
        function buildLetters(container, word) {
            container.innerHTML = '';
            for (const ch of word) {
                if (ch === ' ') {
                    container.appendChild(document.createTextNode(' '));
                    continue;
                }
                const span = document.createElement('span');
                span.className = 'letter-span';
                span.textContent = ch;
                container.appendChild(span);
            }
        }

        // 點擊字母 → 高亮（再點一次取消）
        document.getElementById('content').addEventListener('click', function(e) {
            const span = e.target.closest('.letter-span');
            if (!span) return;
            span.classList.toggle('lit');
            playClickSound();
            // 全部高亮完成 → 自動朗讀單詞一次
            if (span.classList.contains('lit') && allLettersLit()) {
                speakCurrentWord();
            }
        });

        // 當前單詞是否全部字母都已高亮
        function allLettersLit() {
            const spans = document.querySelectorAll('#content .letter-span');
            if (spans.length === 0) return true;
            for (const s of spans) {
                if (!s.classList.contains('lit')) return false;
            }
            return true;
        }

        // 朗讀當前單詞
        function speakCurrentWord() {
            const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
            utterance.lang = isChinese ? 'zh-HK' : 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
        }

        // 未全亮就按「下一個」：搖晃單詞卡提示
        function denyNext() {
            const card = document.querySelector('.text-card');
            card.classList.remove('deny-shake');
            void card.offsetHeight;
            card.classList.add('deny-shake');
            playClickSound();
        }

        // 更新圖片搜索 iframe
        function updateImageSearch(word) {
            const imageFrame = document.getElementById('imageFrame');
            const searchUrl = `https://www.bing.com/images/search?q=${encodeURIComponent(word)}+Cartoon+Png&form=IRTRRL&first=1`;
            imageFrame.src = searchUrl;
            // iframe 已通過 CSS transform: translateY(-150px) 實現向下偏移 150px
        }

        // 顯示/隱藏圖片按鈕
        document.getElementById('showAnswer').addEventListener('click', function() {
            const iframeCard = document.querySelector('.iframe-card');

            // 切換 iframe 顯示狀態
            isIframeVisible = !isIframeVisible;
            if (isIframeVisible) {
                iframeCard.classList.remove('hidden');
                iframeCard.classList.add('visible');
            } else {
                iframeCard.classList.remove('visible');
                iframeCard.classList.add('hidden');
            }
            
            playClickSound();
        });

        // 返回按鈕
        document.getElementById('back').addEventListener('click', function() {
            playClickSound();
            window.location.href = 'study.html';
        });

        document.getElementById('prev').addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
                updateContent();
            }
            playClickSound();
        });

        document.getElementById('next').addEventListener('click', function() {
            // 必須全部字母高亮後才能進入下一個
            if (!allLettersLit()) {
                denyNext();
                return;
            }
            if (currentIndex < items.length - 1) {
                currentIndex++;
                updateContent();
            }
            playClickSound();
        });

        // 返回按鈕已在上定義，此處移除重複監聽器

        document.getElementById('playAudio').addEventListener('click', function() {
            const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
            utterance.lang = isChinese ? 'zh-HK' : 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
            
            // 將當前單詞加入已發音列表（如果還不在列表中）
            if (!pronouncedWords.includes(currentIndex)) {
                pronouncedWords.push(currentIndex);
            }
        });

        // 禁用雙擊功能
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
            return false;
        });

        // 禁止多點觸屏
        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
                event.stopPropagation();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        document.addEventListener('gesturechange', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        document.addEventListener('gestureend', function(event) {
            event.preventDefault();
            event.stopPropagation();
        });

        // 禁止默認縮放手勢
        document.addEventListener('wheel', function(event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        }, { passive: false });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (e.code === 'ArrowLeft') {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateContent();
                }
            } else if (e.code === 'ArrowRight') {
                if (!allLettersLit()) {
                    denyNext();
                } else if (currentIndex < items.length - 1) {
                    currentIndex++;
                    updateContent();
                }
            } else if (e.code === 'Space') {
                e.preventDefault();
                const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
                utterance.lang = isChinese ? 'zh-HK' : 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                speechSynthesis.speak(utterance);
                // 將當前單詞加入已發音列表
                if (!pronouncedWords.includes(currentIndex)) {
                    pronouncedWords.push(currentIndex);
                }
            } else if (e.code === 'KeyP') {
                const utterance = new SpeechSynthesisUtterance(items[currentIndex]);
                utterance.lang = isChinese ? 'zh-HK' : 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                speechSynthesis.speak(utterance);
                // 將當前單詞加入已發音列表
                if (!pronouncedWords.includes(currentIndex)) {
                    pronouncedWords.push(currentIndex);
                }
            }
        });
