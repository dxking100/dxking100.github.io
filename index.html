<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背單詞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'YouYuan', cursive, sans-serif;
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: float 20s linear infinite;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-40px, -40px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,150,100,0.2);
            border: 6px solid #a8e6cf;
            position: relative;
            z-index: 1;
        }

        /* 橫屏佈局 */
        .main-content {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #2ecc71;
            background: white;
            color: #2ecc71;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(46,204,113,0.3);
        }

        .mode-btn:hover:not(.active) {
            background: #e8f8f0;
            transform: scale(1.05);
        }

        .word-card {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            border-radius: 25px;
            padding: 40px 50px;
            margin: 15px 0;
            min-width: 280px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 4px dashed #2ecc71;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .word-card:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 35px rgba(46,204,113,0.3);
        }

        .main-word {
            font-size: 3em;
            color: #1e5631;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
            animation: wordPop 0.5s ease;
            letter-spacing: 5px;
        }

        .hint-word {
            font-size: 2em;
            color: #e74c3c;
            display: none;
            font-weight: bold;
            animation: popIn 0.4s ease;
        }

        .word-card.show-hint .hint-word {
            display: block;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes wordPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 15px 0;
        }

        .btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(46,204,113,0.3);
            min-width: 140px;
        }

        .btn:hover {
            transform: translateX(5px);
            box-shadow: 0 8px 25px rgba(46,204,113,0.4);
        }

        .btn:active {
            transform: translateX(3px);
        }

        .btn-next {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            box-shadow: 0 5px 15px rgba(243,156,18,0.3);
        }

        .btn-next:hover {
            box-shadow: 0 8px 25px rgba(243,156,18,0.4);
        }

        .btn-check {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 5px 15px rgba(52,152,219,0.3);
        }

        .btn-check:hover {
            box-shadow: 0 8px 25px rgba(52,152,219,0.4);
        }

        .btn-speak {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            box-shadow: 0 5px 15px rgba(155,89,182,0.3);
        }

        .btn-speak:hover {
            box-shadow: 0 8px 25px rgba(155,89,182,0.4);
        }

        .progress {
            padding: 15px;
            background: linear-gradient(135deg, #e8f8f0 0%, #d5f5e3 100%);
            border-radius: 18px;
            border: 2px solid #a8e6cf;
        }

        .progress-text {
            font-size: 1.1em;
            color: #1e5631;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .stars {
            font-size: 2em;
        }

        .hint {
            color: #5d8a66;
            font-size: 0.9em;
            margin-top: 15px;
            font-style: italic;
            text-align: center;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #2ecc71;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* 響應式 - 平板電腦 */
        @media (max-width: 1024px) {
            .container {
                padding: 20px 25px;
            }
            .main-content {
                gap: 25px;
            }
            .word-card {
                min-width: 240px;
                min-height: 150px;
                padding: 30px 40px;
            }
            .main-word {
                font-size: 2.5em;
            }
            .hint-word {
                font-size: 1.8em;
            }
        }

        /* 響應式 - 手機 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 15px 20px;
                border-radius: 20px;
                border-width: 4px;
            }
            .main-content {
                flex-direction: column;
                gap: 20px;
            }
            .left-panel, .right-panel {
                width: 100%;
            }
            .mode-selector {
                gap: 8px;
                margin-bottom: 15px;
            }
            .mode-btn {
                padding: 6px 12px;
                font-size: 0.8em;
            }
            .word-card {
                min-width: 100%;
                min-height: 140px;
                padding: 25px 30px;
                border-radius: 20px;
                border-width: 3px;
            }
            .main-word {
                font-size: 2.2em;
                letter-spacing: 3px;
            }
            .hint-word {
                font-size: 1.6em;
            }
            .btn-group {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            .btn {
                min-width: 100px;
                padding: 10px 18px;
                font-size: 0.9em;
            }
            .btn:hover {
                transform: translateY(-4px);
            }
            .progress {
                padding: 12px;
                border-radius: 15px;
            }
            .progress-text {
                font-size: 1em;
            }
            .stars {
                font-size: 1.6em;
            }
            .hint {
                font-size: 0.85em;
                margin-top: 12px;
            }
        }

        /* 響應式 - 小手機 */
        @media (max-width: 480px) {
            .container {
                padding: 12px 15px;
                border-radius: 15px;
            }
            .word-card {
                padding: 20px 25px;
                min-height: 120px;
            }
            .main-word {
                font-size: 1.8em;
                letter-spacing: 2px;
            }
            .hint-word {
                font-size: 1.4em;
            }
            .mode-btn {
                padding: 5px 10px;
                font-size: 0.75em;
            }
            .btn {
                min-width: 90px;
                padding: 8px 14px;
                font-size: 0.85em;
            }
            .progress-text {
                font-size: 0.9em;
            }
            .stars {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="left-panel">
                <div class="mode-selector">
                    <button class="mode-btn active" id="modeLearnEn" onclick="setMode('learnEn')">背英文</button>
                    <button class="mode-btn" id="modeLearnZh" onclick="setMode('learnZh')">背中文</button>
                </div>
                
                <div class="word-card" id="wordCard" onclick="toggleHint()">
                    <div class="main-word" id="mainWord">Panda</div>
                    <div class="hint-word" id="hintWord">熊貓</div>
                </div>

                <p class="hint" id="hintText">點擊卡片或按空格鍵顯示答案</p>
            </div>

            <div class="right-panel">
                <div class="btn-group">
                    <button class="btn btn-check" onclick="toggleHint()">查看答案</button>
                    <button class="btn btn-speak" onclick="speakWord()">發音</button>
                    <button class="btn btn-next" onclick="nextWord()">下一個</button>
                </div>

                <div class="progress">
                    <div class="progress-text">進度：<span id="currentNum">1</span> / <span id="totalNum">3</span></div>
                    <div class="stars" id="stars">⭐⭐⭐</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 英文單字庫（背英文模式）
        const englishWords = [
            { word: "Panda", hint: "熊貓" },
            { word: "Colour", hint: "顏色" },
            { word: "Elephant", hint: "大象" },
            { word: "Computer", hint: "電腦" },
            { word: "Delicious", hint: "美味的" }
        ];

        // 中文單字庫（背中文模式）
        const chineseWords = [
            { word: "熊貓", hint: "Panda" },
            { word: "顏色", hint: "Colour" },
            { word: "快樂", hint: "Happy" },
            { word: "朋友", hint: "Friend" },
            { word: "學校", hint: "School" }
        ];

        let currentIndex = 0;
        let stars = 3;
        let currentMode = 'learnEn';
        let isHintShown = false;
        let currentWords = englishWords;

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeLearnEn').classList.toggle('active', mode === 'learnEn');
            document.getElementById('modeLearnZh').classList.toggle('active', mode === 'learnZh');
            
            // 切換單字庫
            if (mode === 'learnEn') {
                currentWords = englishWords;
                document.getElementById('hintText').textContent = '點擊卡片或按空格鍵顯示中文答案';
            } else if (mode === 'learnZh') {
                currentWords = chineseWords;
                document.getElementById('hintText').textContent = '點擊卡片或按空格鍵顯示英文答案';
            }
            
            currentIndex = 0;
            isHintShown = false;
            loadWord();
        }

        function loadWord() {
            const word = currentWords[currentIndex];
            const mainWordEl = document.getElementById('mainWord');
            const hintWordEl = document.getElementById('hintWord');
            
            // 直接顯示完整單字
            mainWordEl.textContent = word.word;
            mainWordEl.style.color = '#1e5631';
            hintWordEl.textContent = word.hint;
            hintWordEl.style.color = '#e74c3c';
            
            document.getElementById('wordCard').classList.remove('show-hint');
            document.getElementById('currentNum').textContent = currentIndex + 1;
            document.getElementById('totalNum').textContent = currentWords.length;
            
            mainWordEl.style.animation = 'none';
            mainWordEl.offsetHeight;
            mainWordEl.style.animation = 'wordPop 0.5s ease';
        }

        function toggleHint() {
            // 只顯示/隱藏提示
            const wordCard = document.getElementById('wordCard');
            wordCard.classList.toggle('show-hint');
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % currentWords.length;
            isHintShown = false;
            loadWord();
            
            stars = Math.floor(Math.random() * 3) + 1;
            let starString = '';
            for (let i = 0; i < stars; i++) {
                starString += '⭐';
            }
            document.getElementById('stars').textContent = starString;
            
            if (currentIndex === 0) {
                createConfetti();
            }
        }

        function speakWord() {
            const word = currentWords[currentIndex].word;
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                // 根據模式選擇發音語言
                if (currentMode === 'learnEn') {
                    utterance.lang = 'en-US';
                } else if (currentMode === 'learnZh') {
                    utterance.lang = 'zh-CN';
                }
                utterance.rate = 0.8;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('抱歉，你的瀏覽器不支持發音功能～');
            }
        }

        function createConfetti() {
            const colors = ['#2ecc71', '#f39c12', '#3498db', '#9b59b6', '#e74c3c'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleHint();
            } else if (e.code === 'ArrowRight') {
                nextWord();
            } else if (e.code === 'KeyP') {
                speakWord();
            }
        });

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
            window.speechSynthesis.getVoices();
        }

        loadWord();
    </script>
</body>
</html>
